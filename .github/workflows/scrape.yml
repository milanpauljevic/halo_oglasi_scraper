name: HaloOglasi skrejper

on:
  schedule:
    - cron: "*/15 * * * *"   # za privatni repo promeni na "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Uvek najnoviji main (i kod "Re-run jobs"), da seen.json i kod budu aktuelni.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Virtuelni ekran za Chrome, koji se koristi ako Cloudflare traži proveru.
      - run: command -v Xvfb || (sudo apt-get update && sudo apt-get install -y xvfb)

      - run: pip install -r requirements.txt

      - name: Pokreni skrejper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py

      - name: Sačuvaj seen.json
        if: always()
        run: |
          if [ -f seen.json ] && [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Ažuriran seen.json"
            # Pri sudaru zadrži seen.json iz ovog pokretanja (on je nadskup onog na GitHub-u).
            git pull --rebase -X theirs
            git push
          fi
